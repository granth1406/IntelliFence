services:
  - type: web
    name: intellifence-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build:web
    startCommand: npm start
    autoDeployTrigger: commit

  - type: web
    name: intellifence-frontend
    runtime: static
    rootDir: frontend/app-companion-main
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeployTrigger: commit